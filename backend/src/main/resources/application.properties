# FinanceFlow Application Properties
spring.application.name=finance-tracker

# Server
server.port=8002
server.servlet.context-path=/

# Active Profile (dev = H2 in-memory, prod = PostgreSQL)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# --- Database (H2 In-Memory for Dev) ---
spring.datasource.url=jdbc:h2:mem:financedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- Hibernate ORM Configuration ---
spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

# --- Redis Caching ---
spring.cache.type=${SPRING_CACHE_TYPE:simple}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2000ms

# --- JWT Security Config ---
app.jwt.secret=FinanceFlow_Super_Secret_Key_2026_BankGrade_Secure_Enterprise_JWT_Token_Key
app.jwt.expiration=86400000

# --- Mail (optional) ---
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:your@gmail.com}
spring.mail.password=${MAIL_PASSWORD:yourpassword}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# --- CORS & Security ---
app.cors.allowed-origins=*

# --- Logging ---
logging.level.com.financetracker=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
