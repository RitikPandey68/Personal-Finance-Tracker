apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: financeflow-ingress
  namespace: financeflow
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - financeflow.app
      secretName: financeflow-tls-secret
  rules:
    - host: financeflow.app
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: financeflow-service
                port:
                  number: 8002
